name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Release asset (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 xvfb libxcb-*

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-qt pillow

      # The runners don't ship FFmpeg, so install it here so --bundle-ffmpeg
      # can actually find it and ship it inside the app (one-click export).
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Verify Qt QApplication (Linux, diagnostic)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen python -c "from PyQt6.QtWidgets import QApplication; a = QApplication([]); print('QApplication OK')" > /tmp/qt_smoke.log 2>&1
          code=$?
          echo "qt_smoke_exit=$code"
          { echo "### Qt QApplication smoke (exit $code)"; echo '```'; cat /tmp/qt_smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests (with retry for flaky Qt abort)
        shell: bash   # works on all runners incl. Windows (default is PowerShell there)
        run: |
          set +e
          code=1
          for attempt in 1 2 3; do
            echo "== pytest attempt $attempt =="
            if [ "$RUNNER_OS" = "Linux" ]; then
              # xvfb + xcb is far more stable than offscreen on GH runners
              QT_QPA_PLATFORM=xcb xvfb-run -a python -m pytest tests/ -q > /tmp/pytest.log 2>&1
            else
              python -m pytest tests/ -q > /tmp/pytest.log 2>&1
            fi
            code=$?
            if [ $code -eq 0 ]; then break; fi
            echo "pytest failed (exit $code) on attempt $attempt"
            tail -20 /tmp/pytest.log
          done
          { echo "### pytest diagnostics (exit $code)"; echo '```'; tail -120 /tmp/pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # ── Failure diagnostics (ubuntu abort is intermittent & runner-specific;
      #    logs need admin rights, so surface them as an artifact + commit
      #    comment that anyone with repo access can read) ─────────────────
      - name: Upload pytest log on failure (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ runner.os }}
          path: /tmp/pytest.log
          if-no-files-found: ignore

      - name: Post failure diagnostics to commit
        if: failure() && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BODY="CI test step failed on ubuntu (run ${{ github.run_id }})."
          if [ -f /tmp/pytest.log ]; then
            BODY="$BODY

$(tail -80 /tmp/pytest.log)"
          else
            BODY="$BODY

(no /tmp/pytest.log — failure happened before pytest produced output)"
          fi
          python - "$BODY" <<'PY'
import json, os, sys, urllib.request
body = sys.argv[1][:7000]
repo = os.environ["GITHUB_REPOSITORY"]
sha = os.environ["GITHUB_SHA"]
token = os.environ["GH_TOKEN"]
payload = json.dumps({"body": body}).encode()
req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
    data=payload, method="POST",
    headers={"Authorization": f"Bearer {token}",
             "Accept": "application/vnd.github+json"},
)
try:
    urllib.request.urlopen(req)
    print("diagnostics comment posted")
except Exception as e:
    print("comment failed (non-fatal):", e)
PY

      - name: Generate icons
        run: python scripts/make_icons.py

      - name: Build + smoke-test (FFmpeg bundled)
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="--onefile"; fi
          python scripts/build.py $EXTRA --bundle-ffmpeg --smoke

      - name: Package release asset
        shell: bash
        run: python scripts/package_release.py "${{ github.ref_name }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
