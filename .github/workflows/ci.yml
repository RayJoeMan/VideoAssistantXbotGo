name: CI

on:
  push:          # every branch push builds per-OS artifacts (not just main)
  pull_request:

jobs:
  build:
    name: Test + package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-qt pillow

      - name: Verify Qt imports (Linux)
        if: runner.os == 'Linux'
        run: python -c "import PyQt6.QtWidgets; print('PyQt6 import OK')"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Generate icons
        run: python scripts/make_icons.py

      - name: Build executable
        run: python scripts/build.py

      - name: Smoke-test executable
        run: python scripts/build.py --smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lacrosse-highlight-assistant-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
